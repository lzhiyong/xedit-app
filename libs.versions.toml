[versions]
minSdk = "24"
compileSdk = "36"
targetSdk = "36"
buildTools = "37.0.0"
cmake = "4.1.2+"
ndk = "29.0.14206865"

agp = "9.2.0"
kotlin = "2.3.21"
ksp = "2.3.9"
lifecycle = "2.11.0"
navigation = "2.9.8"
room = "2.8.3"
serialization = "1.11.0"
coroutines = "1.10.2"
lsp4j = "1.0.0"

[libraries]
activity = { module = "androidx.activity:activity-ktx", version = "1.13.0" }
annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
annotation-experimental = { module = "androidx.annotation:annotation-experimental", version = "1.6.0" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
core = { module = "androidx.core:core-ktx", version = "1.18.0" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.1" }
fragment = { module = "androidx.fragment:fragment-ktx", version = "1.8.9" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }

junit = { module = "junit:junit", version="4.13.2" }
junit-vintage = { module = "org.junit.vintage:junit-vintage-engine", version="6.1.3" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-test-junit4 = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
androidx-junit = { module = "androidx.test.ext:junit", version="1.3.0" }
androidx-rules = { module = "androidx.test:rules", version="1.7.0" }
androidx-runner = { module = "androidx.test:runner", version="1.7.0" }
robolectric = { module = "org.robolectric:robolectric", version="4.17" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# the Language Server Protocol, see the lsp module
lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version.ref = "lsp4j" }

lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
material = { module = "com.google.android.material:material", version = "1.13.0" }
preference = { module = "androidx.preference:preference-ktx", version = "1.2.1" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.3.2" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version = "3.0.0" }

work-runtime = { module = "androidx.work:work-runtime", version = "2.12.0" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
